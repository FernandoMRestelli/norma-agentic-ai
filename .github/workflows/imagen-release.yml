name: Imagen de release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verificar:
    name: Tag en main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Producción solo corre código que pasó por una PR a main; un tag sobre otra rama no se publica
      - name: Verificar que el tag esté en main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag fuera de main::$GITHUB_REF_NAME no apunta a un commit de main"
            exit 1
          fi

  tests:
    name: Tests (pytest)
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr tests
        run: python -m pytest -v

  publicar:
    name: Publicar en GHCR
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # GHCR exige minúsculas y el dueño del repo tiene mayúsculas
      - name: Calcular nombre y versión
        run: |
          echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # QEMU para construir arm64 desde un runner amd64 (servidores ARM y Macs con Apple Silicon)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGEN }}:${{ env.VERSION }}
            ${{ env.IMAGEN }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
