name: Secretos

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      # Todo el historial: un secreto borrado en un commit posterior sigue expuesto en los anteriores
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Imagen con versión fija para que una regla nueva de gitleaks no rompa el CI sin aviso.
      # --redact evita que el log del CI muestre el secreto que encontró.
      - name: Correr gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner -v

  pre-commit:
    name: Hooks de pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: "pip"

      - name: Cachear pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # SKIP=gitleaks porque el job 'gitleaks' ya escanea todo el historial con la imagen oficial de Docker.
      # pre-commit ejecuta el resto de los checks: claves privadas, archivos pesados (--enforce-all),
      # ruff y los scripts propios de archivos prohibidos y teléfonos.
      - name: Correr pre-commit sobre todos los archivos
        run: SKIP=gitleaks pre-commit run --all-files
