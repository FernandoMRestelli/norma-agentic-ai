name: Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # La versión sale de requirements-dev.txt para que el CI marque lo mismo que `ruff check .` en local
      - name: Instalar ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Correr ruff
        run: ruff check --output-format=github .

  pytest:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      # Si el CI prueba con otra versión que la imagen, un test verde no garantiza nada en producción
      - name: Verificar que Python coincida con el Dockerfile
        run: |
          imagen=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+).*/\1/p' Dockerfile)
          local=$(cat .python-version)
          if [ "$imagen" != "$local" ]; then
            echo "::error title=Versión de Python distinta::Dockerfile usa $imagen y .python-version dice $local"
            exit 1
          fi

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr tests
        run: python -m pytest -v

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Sin dependencias de desarrollo: es la misma imagen que se publica en cada release
      - name: Construir imagen
        run: docker build -t norma-agentic-ai .

      # Un COPY que falta o un import roto recién se ven cuando la app arranca
      - name: Verificar que la API arranque
        run: |
          docker run -d --name api -p 8000:8000 norma-agentic-ai
          for _ in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          echo "::error title=La API no arrancó::/health no respondió en 30 segundos"
          exit 1
