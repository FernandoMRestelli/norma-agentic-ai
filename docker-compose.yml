# Desarrollo: monta el código y los datos encima de la imagen para no reconstruir en cada cambio.
# Producción usa docker-compose.prod.yml (ver CONTRIBUTING.md#producción).
services:
  api:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Fija la base dentro del directorio montado aunque un .env viejo apunte a otro lado
      DATABASE_URL: sqlite:////app/data/norma.db
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./datos_ejemplo:/app/datos_ejemplo:ro
      - ./credentials:/app/credentials:ro
      - ./data:/app/data
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Bot de Telegram por polling (canal de prueba de la beta): docker compose --profile bot up
  # Un solo proceso por token: si otro integrante ya lo está corriendo con el mismo bot, Telegram responde 409.
  bot:
    profiles: ["bot"]
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/norma.db
    volumes:
      - ./backend:/app/backend
      - ./datos_ejemplo:/app/datos_ejemplo:ro
      - ./credentials:/app/credentials:ro
      - ./data:/app/data
    command: python -m backend.telegram_polling
    restart: unless-stopped
